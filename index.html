<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SYSTEM LOCKED</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'Courier New', monospace;
    cursor: none; user-select: none;
  }

  #screen {
    position: fixed; inset: 0;
    background: #050000;
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* ===== ГЛАЗ ===== */
  #eye {
    position: absolute;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 340px; height: 170px;
    background: radial-gradient(ellipse at center, #f5f5f5 0%, #bbb 100%);
    border-radius: 50% / 50%;
    border: 7px solid #300;
    box-shadow: 0 0 80px #f00, inset 0 0 40px #800;
    animation: eyeAppear 1s ease-out forwards;
    z-index: 10;
  }
  #iris {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 140px; height: 140px;
    background: radial-gradient(circle, #ff1a1a 0%, #7a0000 65%, #000 100%);
    border-radius: 50%;
    box-shadow: 0 0 50px #f00;
    animation: irisMove 2.5s 1s infinite alternate ease-in-out;
  }
  #pupil {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    background: #000; border-radius: 50%;
    box-shadow: 0 0 25px #000;
  }
  #eye::after {
    content: ""; position: absolute;
    top: 16%; left: 28%;
    width: 45px; height: 28px;
    background: rgba(255,255,255,.75);
    border-radius: 50%; filter: blur(5px);
  }

  /* ===== КРАСНАЯ ЗАЛИВКА ===== */
  #red {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at center, rgba(180,0,0,.85) 0%, rgba(20,0,0,.97) 70%, #000 100%);
    opacity: 0;
    z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    animation: redBuild 4s ease-in-out forwards;
  }
  /* скан-линии */
  #red::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.25) 0px, rgba(0,0,0,.25) 2px,
      transparent 2px, transparent 4px
    );
    pointer-events: none;
  }
  /* виньетка */
  #red::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 0 250px 80px #000;
    pointer-events: none;
  }

  /* ===== ЧЕРЕП С КОСОЙ ===== */
  #grim {
    font-size: 240px; line-height: 1;
    filter: drop-shadow(0 0 50px #000) drop-shadow(0 0 30px #f00);
    opacity: 0;
    transform: translateY(140px) scale(.4);
    animation:
      grimRise 1.8s 1.2s ease-out forwards,
      grimFloat 2.4s 3s ease-in-out infinite alternate;
    z-index: 25;
  }

  /* ===== ТЕКСТ ===== */
  #msg {
    margin-top: 30px;
    color: #ffdcdc;
    font-size: 42px; font-weight: bold;
    letter-spacing: 8px;
    text-shadow: 0 0 25px #f00, 0 0 60px #900, 3px 3px 0 #000;
    opacity: 0;
    animation: msgIn 1s 2.2s forwards, glitch .12s 2.2s infinite;
    z-index: 30; text-align: center;
  }
  #submsg {
    margin-top: 22px;
    color: #ff8888;
    font-size: 18px; letter-spacing: 3px;
    opacity: 0;
    animation: fadeIn 1s 3.2s forwards;
    z-index: 30; text-align: center;
  }
  #warning {
    position: absolute; bottom: 40px; left: 0; right: 0;
    text-align: center;
    color: #ff3333; font-size: 14px;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeIn 1s 4s forwards, blink 1.2s 5s infinite;
    z-index: 30;
  }

  /* ===== КАПЛИ ===== */
  .drop {
    position: absolute;
    width: 9px; height: 24px;
    background: linear-gradient(#e00, #400);
    border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    animation: drip linear infinite;
    opacity: .85;
    z-index: 15;
  }

  /* ===== АНИМАЦИИ ===== */
  @keyframes eyeAppear {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    55%  { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }
  @keyframes irisMove {
    from { transform: translate(-100%, -50%); }
    to   { transform: translate(20%, -50%); }
  }
  @keyframes redBuild {
    0%   { opacity: 0; }
    12%  { opacity: .35; }
    20%  { opacity: .05; }
    38%  { opacity: .8; }
    48%  { opacity: .35; }
    70%  { opacity: .95; }
    100% { opacity: 1; }
  }
  @keyframes grimRise {
    0%   { opacity: 0; transform: translateY(140px) scale(.4); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes grimFloat {
    from { transform: translateY(0) scale(1) rotate(-2deg); }
    to   { transform: translateY(-18px) scale(1.04) rotate(2deg); }
  }
  @keyframes msgIn {
    0%   { opacity: 0; letter-spacing: 20px; }
    100% { opacity: 1; letter-spacing: 8px; }
  }
  @keyframes glitch {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-2px,1px); }
    50%  { transform: translate(2px,-1px); }
    75%  { transform: translate(-1px,-2px); }
    100% { transform: translate(1px,2px); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50%     { opacity: .2; }
  }
  @keyframes drip {
    0%   { transform: translateY(-60px); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
  }
</style>
</head>
<body>
  <div id="screen">

    <!-- Глаз -->
    <div id="eye">
      <div id="iris"><div id="pupil"></div></div>
    </div>

    <!-- Красный экран -->
    <div id="red">
      <div id="grim">💀☠</div>
      <div id="msg">ВАС ЗАМЕТИЛИ</div>
      <div id="submsg">&gt; ДОСТУП К СИСТЕМЕ ПРИОСТАНОВЛЕН &lt;</div>
    </div>

    <div id="warning">⚠ ОБНАРУЖЕНА ПОДОЗРИТЕЛЬНАЯ АКТИВНОСТЬ · СЕССИЯ ЗАБЛОКИРОВАНА ⚠</div>

  </div>

<script>
  // ===== Капли крови =====
  const screen = document.getElementById('screen');
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + '%';
    d.style.animationDelay = (Math.random() * 4) + 's';
    d.style.animationDuration = (2.5 + Math.random() * 3.5) + 's';
    screen.appendChild(d);
  }

  // ===== Низкий гул (Web Audio, без файлов) =====
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 55;
    gain.gain.value = 0.0;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    // плавное нарастание гула
    gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 2);
    // лёгкое "дрожание" частоты
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = 4;
    lfoGain.gain.value = 6;
    lfo.connect(lfoGain).connect(osc.frequency);
    lfo.start();
  } catch(e) {}

  // ===== Перезапуск анимации по клику (опционально) =====
  // Если хочешь, чтобы клик НЕ сбрасывал — закомментируй блок ниже.
  /*
  document.addEventListener('click', () => {
    document.querySelectorAll('#eye, #red, #grim, #msg').forEach(el => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  });
  */

  // ===== Удержание фокуса (легкий намёк на "лок") =====
  // Просто просит полноэкранный режим — никакой реальной блокировки.
  document.addEventListener('click', () => {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  }, { once: true });
</script>
</body>
</html>
